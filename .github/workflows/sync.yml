# ============================================================================
# Daily market-data sync — replaces local `pnpm worker:sync` invocations.
#
# Two scheduled triggers (UTC):
#   * `30 21 * * 1-5`  — US (all-us):  runs at 21:30 UTC Mon-Fri
#                        = 16:30 ET (EST) / 17:30 ET (EDT), 30 min after US
#                        market close so yfinance daily bars are stable and
#                        FINRA T+1 short-sale data for the prior trading day
#                        is in.
#   * `0 21 * * 1-5`   — HK (all-hk):  runs at 21:00 UTC Mon-Fri
#                        = 05:00 HKT Tue-Sat, ~13 hours after HK market close
#                        so yfinance HK bars are stable and the SFC weekly
#                        short-interest CSV (published Mondays) is in.
#
# Manual runs:
#   Actions tab → "Sync market data" → Run workflow → pick market.
#
# Required GitHub repo secrets:
#   SUPABASE_URL                — https://xxxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   — service_role JWT (worker bypasses RLS)
#
# Optional secrets (worker skips the step when absent):
#   OPENROUTER_API_KEY          — enables sync-news LLM pass
#   FINRA_API_CLIENT_ID         — enables FINRA API path for sync-shorts
#   FINRA_API_SECRET
# ============================================================================

name: Sync market data

on:
  schedule:
    - cron: '30 21 * * 1-5'   # US, weekdays
    - cron: '0 21 * * 1-5'    # HK, Mon-Fri UTC (= Tue-Sat HKT @ 05:00)
  workflow_dispatch:
    inputs:
      mode:
        description: |
          `sync` — run the standard market pipeline (cron equivalent).
          `backfill-sfc` — force-refetch the SFC weekly short-interest CSVs
                           for HK with SHORTS_FORCE_SFC_BACKFILL=1 and
                           SFC_BACKFILL_DAYS=<sfc_backfill_days> below.
                           Used to fill gaps in the historical archive.
        required: true
        default: sync
        type: choice
        options:
          - sync
          - backfill-sfc
      market:
        description: |
          Market to sync (sync mode only — backfill-sfc always runs HK).
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - us
          - hk
      sfc_backfill_days:
        description: |
          How many trailing days of SFC weekly CSVs to backfill
          (backfill-sfc mode only). 1100 ≈ ~3.5 years from 2026 going
          back; 1825 ≈ 5 years.
        required: false
        default: '1100'
        type: string

# Block overlapping runs of the same workflow (cron can occasionally fire
# twice, or a manual run during a scheduled one shouldn't double-charge
# Supabase / yfinance).
concurrency:
  group: sync-market-data
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ inputs.market || 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # pipeline is per-market sequential; 90 min is the
                          # observed upper bound on a cold cache + slow FINRA.
    permissions:
      contents: read       # checkout
      issues: write        # open sync-failure issue on failure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/yfinance/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync worker dependencies
        working-directory: workers/yfinance
        run: uv sync --frozen

      - name: Determine market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: market input is authoritative. backfill-sfc always
            # pins to HK regardless of the market field.
            if [ "${{ inputs.mode }}" = "backfill-sfc" ]; then
              echo "value=hk" >> "$GITHUB_OUTPUT"
            else
              echo "value=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
            fi
          else
            # Cron schedules are in UTC; the *reason* for each schedule picks
            # the market (see header comments). Identify which cron fired by
            # checking which minute-of-hour the trigger maps to — both
            # windows now sit in hour 21 (US at :30, HK at :00).
            #
            # Heuristic: 21:30 UTC = US; 21:00 UTC = HK.
            minute=$(date -u +%-M)
            if [ "$minute" = "30" ]; then
              echo "value=us" >> "$GITHUB_OUTPUT"
            else
              echo "value=hk" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run sync
        working-directory: workers/yfinance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_SECRET: ${{ secrets.FINRA_API_SECRET }}
          # Be loud in logs but not so loud that yfinance / supabase floods
          # the GH Actions log retention (90 days, 2 MB per job).
          LOG_LEVEL: INFO
          # Reduce noise from chatty providers — keeps runtime predictable
          # under GitHub Actions' 90-minute timeout.
          PRICE_THROTTLE_SECONDS: '0.5'
          INFO_THROTTLE_SECONDS: '1.0'
          # backfill-sfc-only knobs — ignored when mode=sync.
          SHORTS_FORCE_SFC_BACKFILL: ${{ inputs.mode == 'backfill-sfc' && '1' || '' }}
          SFC_BACKFILL_DAYS: ${{ inputs.sfc_backfill_days || '' }}
        run: |
          MARKET="${{ steps.market.outputs.value }}"
          MODE="${{ inputs.mode || 'sync' }}"
          echo "==> mode=$MODE market=$MARKET (trigger=${{ github.event_name }})"
          if [ "$MODE" = "backfill-sfc" ]; then
            echo "==> SFC backfill: SHORTS_FORCE_SFC_BACKFILL=$SHORTS_FORCE_SFC_BACKFILL days=$SFC_BACKFILL_DAYS"
          fi
          case "$MARKET" in
            us) uv run python -m eyesinvest_worker all-us ;;
            hk) uv run python -m eyesinvest_worker all-hk ;;
            all) uv run python -m eyesinvest_worker all ;;
            *) echo "Unknown market: $MARKET"; exit 1 ;;
          esac

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const market = '${{ steps.market.outputs.value }}';
            const runUrl = context.payload.repository.html_url + '/actions/runs/' + context.runId;
            const body = [
              '❌ eyesinvest worker sync failed for market = `' + market + '`.',
              '',
              '[Open run →](' + runUrl + ')',
              '',
              'Most common causes:',
              '- `SUPABASE_URL` / `SUPABASE_SERVICE_ROLE_KEY` missing or wrong in repo secrets',
              '- yfinance rate-limit hit (the worker retries per-stock on transient errors)',
              '- FINRA / HKEX upstream outage',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[sync] ${market} sync failed — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['sync-failure'],
            });
