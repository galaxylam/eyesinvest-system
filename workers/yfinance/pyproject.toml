[project]
name = "eyesinvest-worker"
version = "0.2.0"
description = "EyesInvest yfinance sync worker — pulls daily OHLC, quote snapshots, and fundamentals into Supabase."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "yfinance>=0.2.40",
    "supabase>=2.8.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "click>=8.1.7",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eyesinvest-worker = "eyesinvest_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyesinvest_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
