[project]
name = "eyesinvest-worker"
version = "0.2.0"
description = "EyesInvest yfinance sync worker — pulls daily OHLC, quote snapshots, and fundamentals into Supabase."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "yfinance>=0.2.40",
    "supabase>=2.8.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "click>=8.1.7",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    # Phase 7 — news ingestion (crawler-based: RSS dropped, replaced with
    # listing-page crawls via trafilatura for full article bodies).
    "feedparser>=6.0.10",  # kept for backward compat with old config
    "httpx>=0.27",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Phase 8 — AI analysis (OpenRouter exposes an OpenAI-compatible API)
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eyesinvest-worker = "eyesinvest_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyesinvest_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
